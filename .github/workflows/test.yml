name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Qt needs a handful of native libraries even when running with the
      # offscreen platform plugin.  These are the standard PyQt6-on-Ubuntu
      # extras; without them ``import PyQt6.QtWidgets`` aborts with a
      # ``libEGL.so.1`` / ``libxkbcommon-x11.so.0`` lookup error.
      - name: Install Qt runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Qt has to be told to use the offscreen platform on a headless
      # CI runner, otherwise widget instantiation fails before the test
      # even starts.
      - name: Run pytest with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ \
            --cov=PRISM \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Run legacy validation harness
        run: |
          python test_validation.py

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: pytest
          fail_ci_if_error: false

  # The paper's reproducibility claim: in the pinned reference
  # environment (Windows + CPython 3.14 + requirements-paper.txt),
  # replaying every JSON config regenerates the committed CSVs and
  # figure PDFs byte-for-byte.  Any drift makes the tree dirty and
  # fails this job.
  replay-bit-exact:
    name: replay bit-exact vs committed artefacts (reference env)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pinned reference environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-paper.txt

      - name: Replay the full attribution suite
        run: |
          python -m PRISM.replay --all paper/experiments/ --output paper/figures/
          python -m PRISM.replay paper/experiments/supplementary/attr_qft4_bit_flip_T480.json --output paper/figures/supplementary

      - name: Verify byte-identical outputs
        shell: bash
        run: |
          git status --porcelain -- paper/
          if [ -n "$(git status --porcelain -- paper/)" ]; then
            echo "::error::Replay outputs differ from committed artefacts"
            git diff --stat -- paper/
            exit 1
          fi
          echo "All replay outputs are byte-identical to the committed artefacts."
